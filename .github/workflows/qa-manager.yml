name: QA Manager

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install media probe
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run local QA checks
        run: python tools/qa_manager.py --json

      - name: Run live QA checks
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python tools/qa_manager.py --live --json
