<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Black Glove Marketing | Admin access</title><link rel="stylesheet" href="./styles.css"></head>
<body><main class="shell"><section class="hero"><div><p class="eyebrow">Private workspace</p><h1>Admin access</h1><p class="hero-copy">Sign in to view the connected pipeline and workflow controls.</p></div><form id="login-form" class="hero-card"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Sign in</button><p id="login-status" role="status"></p></form></section></main><script type="module">const form=document.querySelector('#login-form');const status=document.querySelector('#login-status');form.addEventListener('submit',async(e)=>{e.preventDefault();status.textContent='Signing in…';const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const data=await r.json();if(!r.ok){status.textContent=data.error||'Unable to sign in';return}location.href='./admin-pipeline.html';});</script></body></html>
