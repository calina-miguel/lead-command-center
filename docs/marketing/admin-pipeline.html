<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Black Glove Marketing | Pipeline</title><link rel="stylesheet" href="./styles.css"></head><body><main class="shell"><section class="hero"><div><p class="eyebrow">Admin workspace</p><h1>Pipeline control</h1><p class="hero-copy">Connected HighLevel pipeline data appears here for authorized administrators.</p></div><div class="hero-card"><button class="primary" id="load" type="button">Load pipeline</button><pre id="output" aria-live="polite">Ready.</pre></div></section></main><script>const output=document.querySelector('#output');document.querySelector('#load').addEventListener('click',async()=>{output.textContent='Loading…';const r=await fetch('/api/ghl/pipelines');const data=await r.json();output.textContent=r.ok?JSON.stringify(data,null,2):(data.error||'Unable to load pipeline');});</script></body></html>
