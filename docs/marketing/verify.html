<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Confirm your email | Black Glove Systems</title>
    <link rel="stylesheet" href="./styles.css?v=apple-ui-1" />
    <link rel="stylesheet" href="./native-ui.css?v=apple-ui-1" />
    <link rel="stylesheet" href="./signup.css?v=onboarding-1" />
    <style>
      .verify-card{width:min(100%,560px);margin:10vh auto;padding:32px;border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:var(--shadow)}
      .verify-card h1{margin:0 0 8px;font-size:28px}.verify-card p{color:var(--muted);line-height:1.5}.verify-card .primary{width:100%;margin-top:18px}.verify-card a{display:inline-block;margin-top:20px;color:var(--blue)}
    </style>
  </head>
  <body class="auth-page">
    <main class="verify-card" aria-live="polite">
      <div class="auth-card-heading"><span class="auth-icon">✦</span><div><h1>Confirm your email</h1><p id="verify-message">Checking your confirmation link…</p></div></div>
      <button class="primary" id="verify-retry" type="button" hidden>Try again</button>
      <a href="./?signup=1">Return to sign in</a>
    </main>
    <script>
      const message=document.querySelector('#verify-message');
      const retry=document.querySelector('#verify-retry');
      const code=new URLSearchParams(location.search).get('oobCode');
      async function confirmEmail(){
        if(!code){message.textContent='This confirmation link is incomplete. Open the latest link from your email.';return}
        retry.hidden=true;
        try{
          const response=await fetch(`${location.origin}/api/signup/verify`,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({oobCode:code})});
          const data=await response.json();
          if(!response.ok)throw new Error(data.error||'We could not confirm this email.');
          message.textContent=data.message||'Email confirmed. Opening your workspace…';
          location.replace(data.redirect||'./workspace.html');
        }catch(error){message.textContent=error.message||'We could not confirm this email. Please try again.';retry.hidden=false}
      }
      retry.addEventListener('click',confirmEmail);
      confirmEmail();
    </script>
  </body>
</html>
